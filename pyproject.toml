[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vak"
version = "0.1.0"
description = "Vāk v1: a local-first Windows hold-to-dictate utility."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "keyboard>=0.13.5",
  "numpy>=1.26",
  "pillow>=10.0",
  "pyperclip>=1.8.2",
  "pystray>=0.19.5",
  "sounddevice>=0.4.6",
  "silero-vad>=5.1",
  "torch>=2.2",
  "pywhispercpp>=1.3.0",
  "PySide6>=6.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
packaging = [
  "pyinstaller>=6.0",
]

[project.scripts]
vak = "vak.__main__:main"

[project.gui-scripts]
vak-desktop = "vak.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
